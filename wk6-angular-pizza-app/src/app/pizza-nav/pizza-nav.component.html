        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">

            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

            <!-- <button class="btn btn-outline-success" data-bs-toggle="modal" type="submit" data-bs-target="#exampleModal">
                <i class="fa-solid fa-cart-shopping fa-lg"></i>

            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal" (onclick)="showCartItems()">
                <i class="fa-solid fa-cart-shopping fa-lg"></i>
                <span class="badge badge-light">{{totalItem}}</span>

<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true" >
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="exampleModalLabel">Items in Your Cart</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="container" *ngIf="cartItems.length === 0">
                <div class="modal-body">
                    <div class="container">
                        <div class="row">
                            <div class="col-md-12">
                                <p class="text-center">
                                    <img src="assets/pics/empty-cart.jpg" style="width: 100%;" alt="" >
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="container" *ngIf="cartItems.length > 0">
                <div class="modal-body">
                    <div class="container">
                        <div class="row">
                            <div class="col-md-12">
                                <table class="table" *ngFor="let item of cartItems">
                                    <tr>
                                        <td>{{item.pizzaName}}</td>
                                        <td>
                                            <div class="container buttons_added">
                                                <input type="button" value="-" class="btn btn-outline-danger" id="minus" (click)="minus(item)">
                                                <input type="number" class="btn btn-outline-primary" step="1" min="1" max="10" title="Qty" size="4" class="input-text" [(ngModel)]="item.quantity">
                                                <!-- <input type="number" step="1" min="1" max="10" title="Qty" size="4"  [(ngModel)]="item.quantity" class="input-text "> -->
                                                <input type="button" value="+" class="btn btn-outline-success" id="plus" (click)="plus(item)">
                                            </div>
                                        </td>
                                        <td>{{item.price | currency: 'CAD'}}</td>
                                        <td (click)="deleteCartItem(item.id)">
                                            <i class="fa-solid fa-trash-can"></i>
                                        </td>                                    
                                    </tr>
                               
                                </table>                              
                                <div class="container">
                                    <div class="row" >
                                        <div class="col" >Total Amout</div>
                                        <div class="text-right col">{{totalAmount | currency: 'CAD'}}</div>
                                    </div>
                                    <div class="row">
                                        <div class="col">GST@5%</div>
                                        <div class="text-right col">{{gst| currency: 'CAD'}}</div>
                                    </div>
                                    <div class="row"> 
                                        <div class="col">Amout Paid</div>
                                        <div class="text-right col">{{paidPrice| currency: 'CAD'}}</div>
                                    </div>
                                   
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <!-- <button type="button" class="btn btn-primary">CheckOut</button> -->
                </div>
            </div>
        </div>
    </div>
</div>
